<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1d29">
<title>Админ-панель — Арсамак</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">🔥 Климат <span>Комфорт</span></div>
  <div class="nav-links">
    <a href="index.html">Каталог</a>
    <a href="cart.html" class="cart-btn">🛒 Корзина</a>
  </div>
</header>

<div class="admin-container">

  <div class="admin-header">
    <div>
      <div class="role">РУКОВОДИТЕЛЬ</div>
      <h1>👑 Арсамак</h1>
      <p class="subtitle">Панель управления магазином «Климат Комфорт»</p>
    </div>
    <div class="stats">
      <div class="stats-icon">📊</div>
      <div id="stats"></div>
    </div>
  </div>

  <!-- ТАБЫ АДМИНКИ -->
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="switchAdminTab('products', this)">📦 Товары</button>
    <button class="admin-tab" onclick="switchAdminTab('orders', this)">🛍 Заказы <b id="ordersBadge"></b></button>
    <button class="admin-tab" onclick="switchAdminTab('promo', this)">🎟️ Промокоды</button>
  </div>

  <!-- ====== ВКЛАДКА: ТОВАРЫ ====== -->
  <div class="admin-tab-content active" id="tab-products">
    <div class="admin-tools">
      <input id="searchAdmin" placeholder="🔍 Поиск товара..." oninput="renderAdminTable()">
      <select id="catFilter" onchange="renderAdminTable()">
        <option value="">Все категории</option>
      </select>
      <button onclick="openModal()">➕ Добавить товар</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th><th>Фото</th><th>Название</th><th>Категория</th>
          <th>Цена</th><th>Старая цена</th><th>Действия</th>
        </tr>
      </thead>
      <tbody id="adminTable"></tbody>
    </table>
  </div>

  <!-- ====== ВКЛАДКА: ЗАКАЗЫ ====== -->
  <div class="admin-tab-content" id="tab-orders">
    <div id="ordersList"></div>
  </div>

  <!-- ====== ВКЛАДКА: ПРОМОКОДЫ ====== -->
  <div class="admin-tab-content" id="tab-promo">
    <div class="admin-tools">
      <input id="newPromoCode" placeholder="Код (WINTER10)" style="text-transform:uppercase">
      <input id="newPromoPercent" type="number" placeholder="Скидка %" min="1" max="50">
      <button onclick="addPromo()">➕ Создать промокод</button>
    </div>
    <table class="admin-table">
      <thead>
        <tr>
          <th>Код</th><th>Скидка</th><th>Использований</th><th>Действия</th>
        </tr>
      </thead>
      <tbody id="promoTable"></tbody>
    </table>
  </div>

</div>

<!-- МОДАЛКА ТОВАРА -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle" style="margin-bottom:20px;">Добавить товар</h2>
    <input type="hidden" id="m_id">

    <!-- КРАСИВАЯ ЗАГРУЗКА ФОТО — ОДНА КНОПКА -->
    <label>📷 Фото товара</label>
    <div class="photo-upload-v2" id="photoBox" onclick="document.getElementById('photoInput').click()">
      <input type="file" id="photoInput" accept="image/*" style="display:none">
      <div class="photo-empty" id="photoEmpty">
        <div class="photo-icon">📷</div>
        <div class="photo-title">Добавить фото</div>
        <div class="photo-hint">Сфоткать или выбрать из галереи</div>
      </div>
      <div class="photo-preview-v2" id="photoPreviewV2" style="display:none;">
        <img id="photoImgV2" src="" alt="">
        <button type="button" class="photo-change" onclick="event.stopPropagation(); document.getElementById('photoInput').click()">
          🔄 Заменить
        </button>
        <button type="button" class="photo-delete" onclick="event.stopPropagation(); removePhoto()">
          🗑
        </button>
      </div>
    </div>

    <label>Название</label>
    <input id="m_name" placeholder="Газовый котёл Baxi...">

    <label>Категория</label>
    <input id="m_category" list="catList" placeholder="Котлы">
    <datalist id="catList"></datalist>

    <label>Цена (₽)</label>
    <input id="m_price" type="number" inputmode="numeric" placeholder="78000">

    <label>Старая цена (₽, можно 0)</label>
    <input id="m_oldPrice" type="number" inputmode="numeric" placeholder="89000">

    <label>Описание</label>
    <input id="m_desc" placeholder="24 кВт, двухконтурный...">

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveProduct()">Сохранить</button>
    </div>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
